name: Build UniFlow Widgets DMG

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: macOS Widget Build
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Swift-Kalenderlogik testen
        run: bash scripts/check-engine.sh

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: App und Widget-Erweiterung bauen (unsigniert)
        env:
          UNIFLOW_SUPABASE_URL: ${{ secrets.UNIFLOW_SUPABASE_URL }}
          UNIFLOW_SUPABASE_KEY: ${{ secrets.UNIFLOW_SUPABASE_KEY }}
        run: |
          xcodebuild \
            -project UniFlowWidgets.xcodeproj \
            -scheme UniFlowWidgets \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            "UNIFLOW_SUPABASE_URL=$UNIFLOW_SUPABASE_URL" \
            "UNIFLOW_SUPABASE_KEY=$UNIFLOW_SUPABASE_KEY" \
            build

      - name: Widget-Extension prüfen und beide Bundles ad-hoc signieren
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/UniFlow Widgets.app"
          EXT="$APP/Contents/PlugIns/UniFlowWidgetExtension.appex"

          # Validate the widget is really embedded and advertises WidgetKit.
          test -d "$APP"
          test -d "$EXT"
          test -f "$APP/Contents/Info.plist"
          test -f "$EXT/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist" "$EXT/Contents/Info.plist"
          EXTENSION_POINT=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$EXT/Contents/Info.plist")
          test "$EXTENSION_POINT" = "com.apple.widgetkit-extension"
          test -d "$EXT/Contents/MacOS"

          # Nested code MUST be signed before the containing app.
          # "-" is an ad-hoc test identity, NOT a Developer ID certificate.
          codesign --force --sign - --timestamp=none \
            --entitlements Widgets/WidgetExtension.entitlements "$EXT"
          codesign --force --sign - --timestamp=none \
            --entitlements UniFlowWidgetsApp/UniFlowWidgets.entitlements "$APP"

          # Fail CI if either the widget extension or enclosing app is not
          # internally valid. No --deep on signing; --deep verifies nesting.
          codesign --verify --strict --verbose=2 "$EXT"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "App and widget extension both pass codesign verification."
          codesign -dv --verbose=2 "$EXT" 2>&1
          codesign -dv --verbose=2 "$APP" 2>&1

      - name: Installations-DMG erstellen
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/UniFlow Widgets.app"
          test -d "$APP"
          STAGING="$RUNNER_TEMP/UniFlow-Widgets-Installer"
          mkdir -p "$STAGING"
          ditto "$APP" "$STAGING/UniFlow Widgets.app"
          codesign --verify --deep --strict --verbose=2 "$STAGING/UniFlow Widgets.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname 'UniFlow Widgets' \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            -o "$RUNNER_TEMP/UniFlow-Widgets-adhoc.dmg"

      - name: DMG zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: UniFlow-Widgets-adhoc-DMG
          path: ${{ runner.temp }}/UniFlow-Widgets-adhoc.dmg
          if-no-files-found: error
